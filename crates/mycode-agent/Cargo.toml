[package]
name = "mycode-agent"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
async-trait = "0.1"
futures-util = "0.3"
home = "0.5"
mycode-core = { path = "../mycode-core" }
mycode-llm = { path = "../mycode-llm" }
mycode-tools = { path = "../mycode-tools" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
