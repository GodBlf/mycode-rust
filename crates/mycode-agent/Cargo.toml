[package]
name = "mycode-agent"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
mycode-core = { path = "../mycode-core" }
mycode-llm = { path = "../mycode-llm" }
mycode-tools = { path = "../mycode-tools" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
