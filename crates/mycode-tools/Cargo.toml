[package]
name = "mycode-tools"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1"
globset = "0.4"
mycode-core = { path = "../mycode-core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
